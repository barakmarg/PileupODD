# ttbar + 200 pileup, targets from the HARD-SCATTER vertex only.
#
# Baseline variant: only vertex_primary == 1 particles become targets, so
# pileup contributes energy but is never something the model must reconstruct.
mode: hard_scatter

dataset:
  repo: CERN/ColliderML-Release-1
  shards_total: 1000
  event_name: ttbar_pu200
  file_indices: {range: [0, 100]}
  max_events_per_file: null

cuts:
  truth_pt: 1.0          # GeV
  truth_eta: 3.0
  target_pt: 0.3         # GeV
  cluster_energy: 0.15   # GeV

clustering:
  backend: gpu cuda
  dc: 75.88106168184893
  rhoc: 104.34315216716726
  dm: 87.0967630118376
  ppbin: 16

runtime:
  chunk_size: 100
  output_dir: data/${dataset.event_name}_${mode}
  tmp_dir: data/tmp
