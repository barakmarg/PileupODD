[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colliderml-pflow"
version = "1.0.0"
description = "Particle-flow training-dataset construction for the ColliderML Open Data Detector sample"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.20",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "datasketches>=5.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# CLUEstering is intentionally not declared as a dependency: its CUDA backend is
# only built when nvcc is present at configure time, so resolving it implicitly
# risks a silent CPU-only install. Build it from source -- see the README.
test = ["pytest>=8.0"]

[project.scripts]
colliderml-pflow = "colliderml_pflow.cli:main"

[tool.setuptools.packages.find]
include = ["colliderml_pflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs HuggingFace access",
    "slow: full-shard runs, minutes to hours",
    "gpu: needs a CUDA device",
]
